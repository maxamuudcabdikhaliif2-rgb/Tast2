
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Bar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: white; 
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    width: 90%;
    max-width: 450px;
    background: #1e293b;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px #0005;
    text-align: center;
}

h1 {
    margin-bottom: 25px;
    font-size: 28px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 14px;
}

.progress-bar {
    width: 100%;
    height: 18px;
    background: #334155;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}



.progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #00dbde, #fc00ff);
    border-radius: 20px;
    transition: width 0.2s;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 8px;
    margin: 5px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-3px);
    opacity: 0.85;
}

.start {
    background: #22c55e;
    color: white;
}

.pause {
    background: #f59e0b;
    color: white;
}

.reset {
    background: #ef4444;
    color: white;
}

#message {
    margin-top: 20px;
    color: #94a3b8;
    font-size: 14px;
}

@media (max-width: 400px) {
    .container {
        padding: 20px 12px;
    }

    button {
        padding: 10px 12px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Progress Bar</h1>

    <div class="progress-info">
        <span>Progress</span>
        <span id="percent">0%</span>
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <button class="start" onclick="startProgress()">Start</button>
    <button class="pause" onclick="pauseProgress()">Pause</button>
    <button class="reset" onclick="resetProgress()">Reset</button>

    <p id="message">Ready to start...</p>
</div>

<script>
let value = 0;
let interval = null;

const progress = document.getElementById("progress");
const percent = document.getElementById("percent");
const message = document.getElementById("message");

function updateProgress() {
    progress.style.width = value + "%";
    percent.textContent = value + "%";
}

function startProgress() {
    if (interval !== null || value >= 100) return;

    message.textContent = "Loading...";

    interval = setInterval(() => {
        value++;
        updateProgress();

        if (value >= 100) {
            clearInterval(interval);
            interval = null;
            message.textContent = "Completed successfully!";
        }
    }, 100);
}

function pauseProgress() {
    clearInterval(interval);
    interval = null;

    if (value < 100) {
        message.textContent = "Progress paused!";
    }
}

function resetProgress() {
    clearInterval(interval);
    interval = null;
    value = 0;

    updateProgress();
    message.textContent = "Ready to start...";
}
</script>

</body>
</html>
