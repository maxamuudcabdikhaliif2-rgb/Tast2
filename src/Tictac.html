<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic tac toe</title>
    <link rel="stylesheet" href="Tictac.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body> 
<!-- BEGIN GAME -->
<div id="overylay">
    <div id="massage">
     <div id="close">
        <i class="fa fa-close"></i>
     </div>
     <div class="content"></div>
    </div>
</div>

<div class="container">
    <div class="tools">
       <div class="symbols">
        <i class="fa fa-close"></i>
        <i class="fa fa-circle-o"></i>
       </div> 
       <div class="turn">
        <span class="current-turn"></span>turn
       </div>
       <div class="reset">
        <div class="button"> 
          <i class="fa fa-rotate-right"></i>
          </div>
       </div>
    </div>
    <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div> 
    </div>
     <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div> 
    </div>
     <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div> 
    </div>
</div>
<div class="stats">
<div class="player">
    <label>Player 1</label>
    <span class="score1">0</span>
</div>
<div class="drews">
    <label>Drews</label>
    <span class="drew">0</span>
</div>
<div class="player">
    <label>Player 2</label>
    <span class="score2">0</span>
</div>

</div>

</div>
<!-- END GAME -->

<script src="Tictac.js"></script>
</body>
</html>
